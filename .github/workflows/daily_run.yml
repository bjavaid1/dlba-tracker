name: Run Daily Property Tracker

on:
  schedule:
    - cron: '0 13 * * *' # 9:00 AM Detroit time daily
  workflow_dispatch: # This allows you to manually test it right now!

permissions:
  contents: write # Crucial: Allows the script to save data_state.json to your repo

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_FROM_EMAIL: ${{ secrets.BREVO_FROM_EMAIL }}
          NOTIFICATION_TO_EMAIL: ${{ secrets.NOTIFICATION_TO_EMAIL }}
        run: python tracker.py
