name: Run Daily Property Tracker

on:
  schedule:
    - cron: '0 13 * * *' # 9:00 AM Detroit time daily
  workflow_dispatch:

permissions:
  contents: write # Crucial: Allows GitHub Action to save the JSON file back to your repo

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests sendgrid

      - name: Run script
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          NOTIFICATION_TO_EMAIL: ${{ secrets.NOTIFICATION_TO_EMAIL }}
        run: python tracker.py
